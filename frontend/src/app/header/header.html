<header
  class="d-flex flex-wrap justify-content-md-between py-3 mb-4 border-bottom">
  <a routerLink="/" class="d-flex col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
    <img src="/logo.png" alt="Logo" width="50" height="50" />
  </a>

  <ul class="nav col-12 col-md-auto mb-2 justify-content mb-md-0">    
    <li><a routerLink="/" routerLinkActive="active" class="nav-link px-2 link-secondary">Home</a></li>
    <li><a routerLink="/about" routerLinkActive="active" class="nav-link px-2 link-dark">About</a></li>
    <li><a routerLink="/store" routerLinkActive="active" class="nav-link px-2 link-dark">Products</a></li>
    <li><a class="nav-link px-2 link-dark">FAQs</a></li>
    <li><a class="nav-link px-2 link-dark">Contact Us</a></li>      
  </ul>

  <div class="col-md-3 text-end">
    @if (isAuthenticated) {
      <span class="me-2 text-muted">Hello, {{ currentUser?.name }}</span>
      <button type="button" class="btn btn-outline-danger" (click)="onLogout()">Logout</button>
    } @else {
      <button type="button" class="btn btn-outline-primary me-2" routerLink="/login">Login</button>
      <button type="button" class="btn btn-primary" routerLink="/signup">Sign Up</button>
    }
  </div>
</header>
