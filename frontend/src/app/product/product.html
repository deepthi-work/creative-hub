@if (product) {
  <div class="container mt-4">
    <div class="row">

      <!-- LEFT: Image gallery -->
      <div class="col-md-6">
        <img [src]="selectedImage" class = "mainImage mb-3" alt="Product Image" />

        <div class="d-flex gap-2">
          @for (img of product.images; track img) {
            <img [src]="img" 
                  class="img-thumbnail" 
                  [class.border-primary]="selectedImage === img"
                  style="width: 80px; cursor: pointer" 
                  (click)="selectImage(img)" 
                  alt="Product thumbnail" />
          }
        </div>
      </div>

      <!-- RIGHT: Product info -->
      <div class="col-md-6">
        <h2>{{ product.name }}</h2>
        <h4 class="text-success">₹{{ product.price }}</h4>

        <p class="mt-3">
          {{ product.description }}
        </p>
        <div class="input-group" style="width: 150px;">
          <button class="btn btn-outline-secondary" type="button" id="button-minus" (click)="decrement()">-</button>
          <input type="text" [(ngModel)]="quantity" id="quantity" class="form-control text-center" value="1" min="1" max="10" aria-label="Quantity"
            aria-describedby="button-minus button-plus" readonly>
          <button class="btn btn-outline-secondary" type="button" id="button-plus" (click)="increment()">+</button>
        </div>

        <button class="btn btn-primary mt-3">
          Add to Cart
        </button>
      </div>

    </div>
  </div>
}
